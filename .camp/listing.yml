name: Conference Scheduler
summary: 'Conference Scheduler turns the talks accepted in Conference Program into a drag-and-drop time × room conference schedule, with an autoscheduler, starred timetables and printing.'
description: |
  Conference Scheduler is the scheduling activity of the Conference Tools
  suite for Moodle (with Conference Submissions, Conference Program and
  Conference Check-in). It takes the submissions accepted in a Conference
  Program activity and lets organisers place them on a time × room grid. The
  same grid is the published timetable that attendees browse, star and export.

  **For organisers (edit mode)**

  - Drag accepted talks onto the grid, move them and resize them. A talk
    starts with the length set for its submission type.
  - SnapGap: a minimum gap between talks in the same room; a drop that is
    slightly off is moved to the nearest valid position.
  - Rooms with colours, order and optional capacities. A talk starred by more
    people than its room holds is flagged in edit mode as possibly overbooked.
  - Span blocks across adjacent rooms for plenaries, breaks and receptions. A
    span block can be a container, such as a poster session, holding several
    presentations side by side.
  - An autoscheduler that keeps same-track talks together and respects the days
    presenters prefer (a hard constraint by default, with an option to ignore it).
  - Manual change notifications to speakers, with an editable template and a
    pending-notifications list. Nothing is sent automatically.

  **For attendees (display mode)**

  - A read-only grid for one day or all days, with talk details from
    Conference Program in a dialogue once its programme is published.
  - Star talks, see them in My timetable and export them as an .ics file.
    Stars are shared with Conference Program.
  - Print the schedule in colour or black & white.

  Backup and restore are supported; course reset clears the schedule and keeps
  the rooms. Requires Moodle 5.2 or 5.3 with mod_confprogram and
  mod_confsubmissions in the same course. No external services or accounts.
