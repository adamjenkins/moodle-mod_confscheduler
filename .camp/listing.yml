name: mod_confscheduler
summary: 'Conference Scheduler — a Moodle activity that turns accepted submissions from mod_confprogram into a drag-and-drop time × room schedule, with autoscheduling and print/export support.'
description: |
  A drag-and-drop time × room grid over the accepted talks from a linked
  Conference Program: SnapGap drop nudging, resizable blocks, colour-themeable
  rooms with capacities and overbooking flags, column-spanning plenary/break
  blocks (including container blocks for poster sessions and panels), and an
  autoscheduler that groups same-track talks and honours submitters' preferred
  days. Prints and exports the finished schedule. Part of the Conference Tools
  suite.
labels:
  # Required disclosure labels — pick all that apply (RFC §4.7):
  #   fully-free | freemium | paid-service | external-account
  #   donation-supported | commercial-support-available
  - fully-free
screenshots:
  - path: .camp/screenshots/01-display-day.png
    caption: 'The published schedule for one day: rooms as columns, a plenary across all rooms, talks with speakers, track and room/time.'
  - path: .camp/screenshots/02-my-timetable.png
    caption: 'My timetable: an attendee''s starred talks are highlighted and the rest are dimmed.'
  - path: .camp/screenshots/03-poster-session.png
    caption: A poster-session container holding four posters that share its time and rooms, next to a regular talk.
  - path: .camp/screenshots/04-talk-details.png
    caption: 'Clicking a talk opens its details from Conference Program: time, room, track, abstract and speakers.'
  - path: .camp/screenshots/05-edit-mode.png
    caption: 'Edit mode (full screen): the Unscheduled panel, room capacities, SnapGap and row-height controls, and an overbooking warning on a talk starred by more people than Seminar Room C holds.'
  - path: .camp/screenshots/06-autoscheduler.png
    caption: 'The autoscheduler: choose a window, optionally clear it first, and choose whether to respect preferred dates.'
  - path: .camp/screenshots/07-span-block.png
    caption: 'Adding a span block for a break or plenary: label, rooms, time, colour, container option and displayed room name.'
  - path: .camp/screenshots/08-print-bw.png
    caption: 'Black & white print mode, ready for the browser''s print dialogue.'
